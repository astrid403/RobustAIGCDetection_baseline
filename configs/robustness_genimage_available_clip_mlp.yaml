experiment_name: genimage_splitB_available_clip_mlp_robustness
model_type: clip_mlp
clip_model: ViT-B-32
pretrained: openai
dataset: GenImage
test_csv: outputs/splits/genimage_splitB_available_test_unseen.csv
checkpoint: outputs/checkpoints/genimage_splitB_available_clip_mlp/best_model.pt
image_size: 224
