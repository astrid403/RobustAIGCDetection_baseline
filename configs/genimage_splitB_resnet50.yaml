num_workers: 2
train_generators:
  - Stable Diffusion V1.4
  - ADM
  - BigGAN
genimage_splits:
  splitB_train_generators:
    - Stable Diffusion V1.4
    - ADM
    - BigGAN
  splitB_test_generators:
    - GLIDE
    - Midjourney
    - Wukong
    - VQDM

